<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>GhostLibrary</title>
</head>
<body>
    <div id="GhostLibraryConfigPage"
         data-role="page"
         class="page type-interior pluginConfigurationPage"
         data-require="emby-checkbox,emby-button">
        <div data-role="content">
            <div class="content-primary">
                <form id="GhostLibraryConfigForm">

                    <div class="sectionTitleContainer flex align-items-center">
                        <h2 class="sectionTitle">GhostLibrary</h2>
                    </div>

                    <p>
                        Select the libraries to hide from the client home screen.
                        Hidden libraries remain fully accessible to other plugins
                        (e.g. Cinema Mode) and the file system.
                    </p>

                    <div class="sectionTitleContainer" style="margin-top:1.5em">
                        <h3 class="sectionTitle" style="font-size:1em">Libraries</h3>
                    </div>

                    <!-- Populated dynamically from /Library/VirtualFolders -->
                    <div id="ghostLibraryList" style="margin-bottom:1.5em">
                        <p id="ghostLibraryStatus" style="opacity:0.7">Loading libraries…</p>
                    </div>

                    <div>
                        <button is="emby-button"
                                type="submit"
                                class="raised button-submit block emby-button">
                            <span>Save</span>
                        </button>
                    </div>

                </form>
            </div>
        </div>

        <script type="text/javascript">
            (function () {
                var pluginUniqueId = '8a3b2c7d-f1e4-4a9b-b6d3-1c2e5f8a0d4e';

                // Map Jellyfin collection types to readable labels
                var typeLabels = {
                    movies:      'Movies',
                    tvshows:     'TV Shows',
                    music:       'Music',
                    musicvideos: 'Music Videos',
                    homevideos:  'Home Videos',
                    boxsets:     'Collections',
                    books:       'Books',
                    photos:      'Photos',
                    mixed:       'Mixed Content'
                };

                function escapeHtml(str) {
                    return String(str || '')
                        .replace(/&/g, '&amp;')
                        .replace(/</g, '&lt;')
                        .replace(/>/g, '&gt;')
                        .replace(/"/g, '&quot;');
                }

                function renderLibraries(libraries, hiddenIds) {
                    var container = document.querySelector('#ghostLibraryList');
                    container.innerHTML = '';

                    if (!libraries || libraries.length === 0) {
                        container.innerHTML = '<p style="opacity:0.7">No libraries found.</p>';
                        return;
                    }

                    libraries.forEach(function (lib) {
                        var isHidden  = hiddenIds.indexOf(lib.ItemId) !== -1;
                        var typeKey   = (lib.CollectionType || 'mixed').toLowerCase();
                        var typeLabel = typeLabels[typeKey] || lib.CollectionType || 'Mixed';

                        var label = document.createElement('label');
                        label.className = 'checkboxContainer';
                        label.style.cssText =
                            'display:flex;align-items:center;padding:10px 0;' +
                            'cursor:pointer;border-bottom:1px solid rgba(255,255,255,0.07);';

                        var cb = document.createElement('input');
                        cb.type = 'checkbox';
                        cb.setAttribute('is', 'emby-checkbox');
                        cb.className = 'ghost-library-cb';
                        cb.dataset.libraryId = lib.ItemId;
                        cb.checked = isHidden;

                        var info = document.createElement('span');
                        info.style.cssText = 'margin-left:14px;line-height:1.4;';
                        info.innerHTML =
                            '<strong>' + escapeHtml(lib.Name) + '</strong>' +
                            '<br><small style="opacity:0.55">' + escapeHtml(typeLabel) + '</small>';

                        label.appendChild(cb);
                        label.appendChild(info);
                        container.appendChild(label);
                    });
                }

                // ── Load config + libraries in parallel, then render ──────────────────
                document.querySelector('#GhostLibraryConfigPage')
                    .addEventListener('pageshow', function () {
                        Dashboard.showLoadingMsg();

                        Promise.all([
                            ApiClient.getPluginConfiguration(pluginUniqueId),
                            ApiClient.getJSON(ApiClient.getUrl('Library/VirtualFolders'))
                        ]).then(function (results) {
                            var config    = results[0];
                            var libraries = results[1];
                            var hiddenIds = config.HiddenLibraryIds || [];

                            renderLibraries(libraries, hiddenIds);
                            Dashboard.hideLoadingMsg();
                        }).catch(function () {
                            document.querySelector('#ghostLibraryStatus').textContent =
                                'Error loading libraries.';
                            Dashboard.hideLoadingMsg();
                        });
                    });

                // ── Save: collect checked IDs and persist ─────────────────────────────
                document.querySelector('#GhostLibraryConfigForm')
                    .addEventListener('submit', function (e) {
                        e.preventDefault();
                        Dashboard.showLoadingMsg();

                        var selectedIds = Array.prototype.slice
                            .call(document.querySelectorAll('.ghost-library-cb:checked'))
                            .map(function (cb) { return cb.dataset.libraryId; });

                        ApiClient.getPluginConfiguration(pluginUniqueId)
                            .then(function (config) {
                                config.HiddenLibraryIds = selectedIds;
                                return ApiClient.updatePluginConfiguration(
                                    pluginUniqueId, config);
                            })
                            .then(function (result) {
                                Dashboard.processPluginConfigurationUpdateResult(result);
                            });

                        return false;
                    });
            })();
        </script>
    </div>
</body>
</html>
