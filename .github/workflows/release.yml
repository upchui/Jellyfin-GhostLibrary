name: Publish Release

# Triggered by pushing a version tag, e.g.:  git tag v1.0.0.0 && git push origin v1.0.0.0
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Strip the leading 'v' from the tag to get the bare version number
      - name: Get version
        id: version
        run: echo "value=${GITHUB_REF_NAME#v}" >> $GITHUB_OUTPUT

      # Restore packages (uses NuGet.org, no extra feed required)
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore

      # Publish with AssemblyVersion matching the tag so the DLL version is correct
      - name: Publish
        run: |
          dotnet publish -c Release -o dist \
            --no-restore \
            /p:DebugType=None \
            /p:DebugSymbols=false \
            /p:AssemblyVersion=${{ steps.version.outputs.value }} \
            /p:Version=${{ steps.version.outputs.value }}

      # Zip only the DLL — no external runtime deps because all Jellyfin packages
      # use ExcludeAssets=runtime and are provided by the server at runtime.
      - name: Create ZIP
        run: |
          zip -j "GhostLibrary_${{ steps.version.outputs.value }}.zip" \
            dist/Jellyfin.Plugin.GhostLibrary.dll

      - name: Compute MD5 checksum
        id: checksum
        run: |
          echo "md5=$(md5sum GhostLibrary_${{ steps.version.outputs.value }}.zip | awk '{print $1}')" \
            >> $GITHUB_OUTPUT

      # Create the GitHub Release and attach the ZIP
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: GhostLibrary_${{ steps.version.outputs.value }}.zip
          generate_release_notes: true

      # Switch to main, prepend the new version entry to manifest.json, and push
      - name: Update manifest.json
        env:
          VERSION: ${{ steps.version.outputs.value }}
          CHECKSUM: ${{ steps.checksum.outputs.md5 }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git checkout main
          git pull origin main --ff-only

          python3 - <<'PYEOF'
          import json, os, datetime

          version    = os.environ["VERSION"]
          checksum   = os.environ["CHECKSUM"]
          tag        = os.environ["TAG"]
          repo       = os.environ["REPO"]
          source_url = f"https://github.com/{repo}/releases/download/{tag}/GhostLibrary_{version}.zip"
          timestamp  = datetime.datetime.now(datetime.timezone.utc).strftime("%Y-%m-%dT%H:%M:%S.0000000Z")

          with open("manifest.json") as f:
              manifest = json.load(f)

          manifest[0]["versions"].insert(0, {
              "version":    version,
              "changelog":  "See GitHub release notes.",
              "targetAbi":  "10.9.0.0",
              "sourceUrl":  source_url,
              "checksum":   checksum,
              "timestamp":  timestamp
          })

          with open("manifest.json", "w") as f:
              json.dump(manifest, f, indent=2)
              f.write("\n")
          PYEOF

          git add manifest.json
          # Commit only when something changed (idempotent)
          git diff --staged --quiet || \
            git commit -m "chore: update manifest for ${TAG}"
          git push origin main
