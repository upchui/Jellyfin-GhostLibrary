<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>GhostLibrary</title>
</head>
<body>
    <div id="GhostLibraryConfigPage"
         data-role="page"
         class="page type-interior pluginConfigurationPage">
        <div data-role="content">
            <div class="content-primary">
                <form id="GhostLibraryConfigForm">

                    <div class="sectionTitleContainer">
                        <h2 class="sectionTitle">GhostLibrary</h2>
                    </div>

                    <p style="opacity:.75; margin-bottom:1.5em">
                        Select the libraries to hide from the client home screen.
                        Hidden libraries remain fully accessible to other plugins
                        (e.g.&nbsp;Cinema&nbsp;Mode) and the file system.
                    </p>

                    <div class="sectionTitleContainer">
                        <h3 class="sectionTitle" style="font-size:1em">Libraries</h3>
                    </div>

                    <!-- Status line, e.g. "2 libraries hidden" -->
                    <div id="ghostStatus"
                         style="font-size:.82em; opacity:.55; margin-bottom:.6em; min-height:1.2em">
                    </div>

                    <!-- Cards injected here by JS -->
                    <div id="ghostList"
                         style="display:flex; flex-direction:column; gap:8px; margin-bottom:1.75em">
                        <p style="opacity:.5">Loading libraries…</p>
                    </div>

                    <button is="emby-button"
                            type="submit"
                            class="raised button-submit block emby-button">
                        <span>Save</span>
                    </button>

                </form>
            </div>
        </div>

        <script type="text/javascript">
        (function () {
            var PLUGIN_ID = '8a3b2c7d-f1e4-4a9b-b6d3-1c2e5f8a0d4e';

            var TYPE_ICONS = {
                movies:      '🎬',
                tvshows:     '📺',
                music:       '🎵',
                musicvideos: '🎸',
                homevideos:  '🏠',
                boxsets:     '📦',
                books:       '📚',
                photos:      '📷',
                mixed:       '📁'
            };

            var TYPE_LABELS = {
                movies:      'Movies',
                tvshows:     'TV Shows',
                music:       'Music',
                musicvideos: 'Music Videos',
                homevideos:  'Home Videos',
                boxsets:     'Collections',
                books:       'Books',
                photos:      'Photos',
                mixed:       'Mixed Content'
            };

            /* ── Inline style helpers ──────────────────────────────── */
            var CARD_BASE    = 'display:flex; align-items:center; padding:14px 16px;' +
                               'border-radius:6px; cursor:pointer; margin:0;';
            var CARD_NORMAL  = CARD_BASE + 'background:rgba(255,255,255,.04);' +
                               'border:1px solid rgba(255,255,255,.08);';
            var CARD_HIDDEN  = CARD_BASE + 'background:rgba(0,164,220,.09);' +
                               'border:1px solid rgba(0,164,220,.45);';
            var ICON_NORMAL  = 'width:42px; height:42px; border-radius:50%; flex-shrink:0;' +
                               'display:flex; align-items:center; justify-content:center;' +
                               'font-size:20px; margin-right:14px; background:rgba(255,255,255,.08);';
            var ICON_HIDDEN  = ICON_NORMAL.replace('rgba(255,255,255,.08)', 'rgba(0,164,220,.22)');
            var TICK_NORMAL  = 'width:22px; height:22px; border-radius:50%; flex-shrink:0;' +
                               'display:flex; align-items:center; justify-content:center;' +
                               'font-size:13px; margin-left:16px;' +
                               'border:2px solid rgba(255,255,255,.22); color:transparent;';
            var TICK_HIDDEN  = 'width:22px; height:22px; border-radius:50%; flex-shrink:0;' +
                               'display:flex; align-items:center; justify-content:center;' +
                               'font-size:13px; margin-left:16px;' +
                               'background:#00a4dc; border:2px solid #00a4dc; color:#fff;';

            function updateStatus() {
                var n = document.querySelectorAll('.ghost-cb:checked').length;
                document.getElementById('ghostStatus').textContent =
                    n === 0 ? 'No libraries hidden' :
                    n === 1 ? '1 library hidden'    :
                              n + ' libraries hidden';
            }

            /* Builds one card element — all styling via inline styles */
            function makeCard(lib, hidden) {
                var typeKey   = (lib.CollectionType || 'mixed').toLowerCase();
                var icon      = TYPE_ICONS[typeKey]  || '📁';
                var typeLabel = TYPE_LABELS[typeKey] || lib.CollectionType || 'Mixed';

                /* Wrapper <label> — full row is the click target */
                var card = document.createElement('label');
                card.style.cssText = hidden ? CARD_HIDDEN : CARD_NORMAL;

                /* Hidden native checkbox (invisible but drives state) */
                var cb = document.createElement('input');
                cb.type = 'checkbox';
                cb.className = 'ghost-cb';
                cb.dataset.libraryId = lib.ItemId;
                cb.checked = hidden;
                cb.style.cssText = 'position:absolute; opacity:0; width:0; height:0; pointer-events:none;';

                /* Icon bubble */
                var iconEl = document.createElement('div');
                iconEl.style.cssText = hidden ? ICON_HIDDEN : ICON_NORMAL;
                iconEl.textContent = icon;

                /* Text block */
                var info = document.createElement('div');
                info.style.cssText = 'flex:1; min-width:0;';

                var nameEl = document.createElement('div');
                nameEl.style.cssText = 'font-size:1em; font-weight:500;' +
                    'white-space:nowrap; overflow:hidden; text-overflow:ellipsis;';
                nameEl.textContent = lib.Name;

                var typeEl = document.createElement('div');
                typeEl.style.cssText = 'font-size:.78em; opacity:.5; margin-top:2px; text-transform:capitalize;';
                typeEl.textContent = typeLabel;

                info.appendChild(nameEl);
                info.appendChild(typeEl);

                /* Circle checkmark */
                var tick = document.createElement('div');
                tick.style.cssText = hidden ? TICK_HIDDEN : TICK_NORMAL;
                tick.textContent   = hidden ? '✓' : '';

                card.appendChild(cb);
                card.appendChild(iconEl);
                card.appendChild(info);
                card.appendChild(tick);

                /* Toggle styles on change */
                cb.addEventListener('change', function () {
                    var on = this.checked;
                    card.style.cssText   = on ? CARD_HIDDEN  : CARD_NORMAL;
                    iconEl.style.cssText = on ? ICON_HIDDEN  : ICON_NORMAL;
                    tick.style.cssText   = on ? TICK_HIDDEN  : TICK_NORMAL;
                    tick.textContent     = on ? '✓' : '';
                    updateStatus();
                });

                return card;
            }

            function renderLibraries(libraries, hiddenIds) {
                var list = document.getElementById('ghostList');
                list.innerHTML = '';

                if (!libraries || !libraries.length) {
                    list.innerHTML = '<p style="opacity:.5">No libraries found.</p>';
                    updateStatus();
                    return;
                }

                libraries.forEach(function (lib) {
                    list.appendChild(makeCard(lib, hiddenIds.indexOf(lib.ItemId) !== -1));
                });
                updateStatus();
            }

            /* ── Load config + library list in parallel, then render ── */
            document.getElementById('GhostLibraryConfigPage')
                .addEventListener('pageshow', function () {
                    Dashboard.showLoadingMsg();
                    Promise.all([
                        ApiClient.getPluginConfiguration(PLUGIN_ID),
                        ApiClient.getJSON(ApiClient.getUrl('Library/VirtualFolders'))
                    ]).then(function (r) {
                        renderLibraries(r[1], r[0].HiddenLibraryIds || []);
                        Dashboard.hideLoadingMsg();
                    }).catch(function () {
                        document.getElementById('ghostList').innerHTML =
                            '<p style="color:#e53935">Failed to load libraries.</p>';
                        Dashboard.hideLoadingMsg();
                    });
                });

            /* ── Save ─────────────────────────────────────────────── */
            document.getElementById('GhostLibraryConfigForm')
                .addEventListener('submit', function (e) {
                    e.preventDefault();
                    Dashboard.showLoadingMsg();

                    var ids = Array.prototype.slice
                        .call(document.querySelectorAll('.ghost-cb:checked'))
                        .map(function (cb) { return cb.dataset.libraryId; });

                    ApiClient.getPluginConfiguration(PLUGIN_ID)
                        .then(function (cfg) {
                            cfg.HiddenLibraryIds = ids;
                            return ApiClient.updatePluginConfiguration(PLUGIN_ID, cfg);
                        })
                        .then(function (result) {
                            Dashboard.processPluginConfigurationUpdateResult(result);
                        });

                    return false;
                });
        })();
        </script>
    </div>
</body>
</html>
